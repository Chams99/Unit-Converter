services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
      args:
        NODE_IMAGE: node:24-bookworm-slim
    restart: unless-stopped
    init: true
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    ulimits:
      core: 0
      nofile:
        soft: 1024
        hard: 1024
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    env_file:
      - path: /etc/dokploy/private-runtime/convertal/api.runtime.env
        required: true
        format: raw
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: "8787"
      NODE_OPTIONS: --max-old-space-size=192 --disable-proto=throw
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - candidate

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
      args:
        NODE_IMAGE: node:24-bookworm-slim
        CONVERTAL_API_URL: http://api:8787
    restart: unless-stopped
    init: true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.5"
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
      - /app/apps/web/.next/cache:size=32m,mode=0700,uid=1000,gid=1000,noexec,nosuid
    ulimits:
      core: 0
      nofile:
        soft: 1024
        hard: 1024
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=256 --disable-proto=throw
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - candidate

networks:
  candidate:
    name: convertal-source-candidate
    driver: bridge
